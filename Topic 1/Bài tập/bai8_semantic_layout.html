<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8: Thiết kế layout trang web HTML5 Semantic (Tutorial Republic)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      padding: 30px;
    }
    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #7a9cb5;
      background-color: #8da4be; /* Màu xanh xám của container theo mẫu ảnh */
    }
    /* Header */
    header {
      background-color: #7997b5;
      padding: 16px 24px;
      border-bottom: 1px solid #6b86a3;
    }
    header h1 {
      font-size: 24px;
      color: #1a202c;
      font-weight: bold;
    }
    /* Main Content Container: 2 cột (Sidebar bên trái, Nội dung chính bên phải) */
    .content-area {
      display: flex;
      min-height: 250px;
    }
    /* Navigation / Sidebar bên trái */
    nav {
      width: 180px;
      background-color: #8da4be;
      padding: 20px 24px;
      border-right: 1px solid #7d96b0;
    }
    nav ul {
      list-style-type: none;
    }
    nav ul li {
      margin-bottom: 12px;
    }
    nav ul li a {
      color: #1e3a8a;
      text-decoration: underline;
      font-size: 15px;
      font-weight: 500;
    }
    nav ul li a:hover {
      color: #0f172a;
    }
    /* Main section bên phải */
    main {
      flex: 1;
      background-color: #e5e9f0; /* Nền xám sáng của phần nội dung */
      padding: 24px 30px;
    }
    main h2 {
      font-size: 20px;
      color: #111827;
      margin-bottom: 16px;
      font-weight: bold;
    }
    main p {
      font-size: 15px;
      color: #374151;
      line-height: 1.6;
    }
    /* Footer */
    footer {
      background-color: #7997b5;
      color: #1a202c;
      text-align: center;
      padding: 14px 20px;
      font-size: 14px;
      border-top: 1px solid #6b86a3;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Header chuẩn ngữ nghĩa HTML5 -->
    <header>
      <h1>Tutorial Republic</h1>
    </header>

    <!-- Khu vực nội dung chia cột gồm nav và main -->
    <div class="content-area">
      <!-- Sidebar Navigation -->
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

      <!-- Nội dung chính của trang web -->
      <main>
        <h2>Welcome to our site</h2>
        <p>Here you will learn to create websites...</p>
      </main>
    </div>

    <!-- Footer bản quyền -->
    <footer>
      <p>copyright &copy; tutorialrepublic.com</p>
    </footer>
  </div>

</body>
</html>
