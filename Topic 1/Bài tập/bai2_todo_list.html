<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2: Danh sách To Do, Định dạng Text & Khung cuộn nội dung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f9f9f9;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
    }
    .scroll-box {
      border: 1px solid #777;
      padding: 16px;
      height: 180px;
      overflow-y: scroll;
      background-color: #fff;
      width: 450px;
      box-sizing: border-box;
      margin-top: 12px;
    }
    .form-group {
      margin: 16px 0;
    }
    address {
      font-style: italic;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>To Do</h2>
    <ul>
      <li>Buy some cookies</li>
      <li>Do some cleaning</li>
      <li><s>Relaxation time</s></li>
      <li><u>Visit a doctor</u></li>
    </ul>

    <div class="form-group">
      <label for="week-select">Select Week: </label>
      <input type="week" id="week-select" name="week">
    </div>

    <!-- Khung cuộn mô phỏng giao diện khung hiển thị trong hình ảnh đề bài -->
    <div class="scroll-box">
      <address>
        Written by <a href="mailto:jon.doe@example.com">Jon Doe</a>.<br>
        Contact us at:<br>
        Post Box 210, Hollywood<br>
        USA
      </address>

      <h3 style="margin-top: 16px; margin-bottom: 8px;">To Do</h3>
      <ul>
        <li>Buy some cookies</li>
        <li>Do some cleaning</li>
        <li><s>Relaxation time</s></li>
        <li><u>Visit a doctor</u></li>
      </ul>
    </div>
  </div>

</body>
</html>
