<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 4: Select, Optgroup, Checkbox, Radio, Fieldset & Legend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding: 24px;
      max-width: 650px;
      margin: 0 auto;
      background-color: #f9f9f9;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .select-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    select {
      font-size: 14px;
      padding: 4px;
    }
    .single-select {
      width: 160px;
    }
    .multi-select {
      width: 160px;
      height: 140px;
    }
    .note {
      font-style: italic;
      color: #555;
      font-size: 13px;
      margin-bottom: 20px;
    }
    fieldset {
      border: 1px solid #777;
      border-radius: 4px;
      padding: 10px 16px 14px 16px;
      margin-bottom: 16px;
    }
    legend {
      font-weight: bold;
      padding: 0 6px;
    }
    .options label {
      margin-right: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <form action="#" method="get">

      <div class="select-container">
        <!-- Dropdown đơn -->
        <div>
          <select name="car_single" class="single-select">
            <optgroup label="Sports cars">
              <option value="ferrari">Ferrari</option>
              <option value="lamborghini" selected>Lamborghini</option>
            </optgroup>
            <optgroup label="Luxury cars">
              <option value="mercedes">Mercedes</option>
              <option value="bentley">Bentley</option>
            </optgroup>
          </select>
        </div>

        <!-- Listbox chọn nhiều (Multiple selection) -->
        <div>
          <select name="car_multiple" multiple size="7" class="multi-select">
            <optgroup label="Sports cars">
              <option value="ferrari">Ferrari</option>
              <option value="lamborghini">Lamborghini</option>
            </optgroup>
            <optgroup label="Luxury cars">
              <option value="mercedes">Mercedes</option>
              <option value="bentley">Bentley</option>
            </optgroup>
          </select>
        </div>
      </div>

      <p class="note">
        Note: Press control or shift key on the keyboard while clicking on the other options to enable multiple selections.
      </p>

      <!-- Fieldset Hobbies -->
      <fieldset>
        <legend>Hobbies</legend>
        <div class="options">
          <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
          <label><input type="checkbox" name="hobbies" value="music"> Music</label>
          <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
        </div>
      </fieldset>

      <!-- Fieldset Gender -->
      <fieldset>
        <legend>Gender</legend>
        <div class="options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </fieldset>

    </form>
  </div>

</body>
</html>
