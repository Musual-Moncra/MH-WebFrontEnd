<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 6: Biểu mẫu gửi phản hồi (Feedback / Contact Form)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding: 24px;
      max-width: 550px;
      margin: 0 auto;
      background-color: #f7f9fa;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 24px 28px;
      border: 1px solid #17a2b8;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #222;
    }
    .required-star {
      color: #e63946;
    }
    .name-row {
      display: flex;
      gap: 12px;
    }
    .name-col {
      flex: 1;
    }
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .sub-label {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
    .btn-submit {
      background-color: #388087;
      color: #fff;
      border: none;
      padding: 9px 24px;
      font-size: 15px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #2b6369;
    }
  </style>
</head>
<body>

  <div class="card">
    <form action="#" method="post">
      
      <!-- Full Name -->
      <div class="form-group">
        <label>Full Name <span class="required-star">*</span></label>
        <div class="name-row">
          <div class="name-col">
            <input type="text" name="first_name" placeholder="First" required>
          </div>
          <div class="name-col">
            <input type="text" name="last_name" placeholder="Last" required>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email <span class="required-star">*</span></label>
        <input type="email" id="email" name="email" required>
      </div>

      <!-- Subject -->
      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="advertise" selected>Advertise</option>
          <option value="partnership">Partnership</option>
          <option value="general_query">General Query</option>
          <option value="support">Technical Support</option>
        </select>
      </div>

      <!-- Your Message -->
      <div class="form-group">
        <label for="message">Your Message <span class="required-star">*</span></label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" class="btn-submit">Submit</button>
      </div>

    </form>
  </div>

</body>
</html>
