<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2 - Contact Us Card (CSS Box Model & Card Design)</title>
  <style>
    /* Reset & Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f7f9fa;
      color: #333;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .exercise-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      align-self: flex-start;
      max-width: 400px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    /* Card Container */
    .contact-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e0e4e8;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Card Header */
    .card-header {
      background-color: #48cfad;
      color: #ffffff;
      text-align: center;
      padding: 18px 20px;
    }

    .card-header h2 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Card Body */
    .card-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    /* Input & Textarea Styling */
    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #dcdfe3;
      border-radius: 2px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: #48cfad;
      box-shadow: 0 0 5px rgba(72, 207, 173, 0.35);
    }

    .form-control::placeholder {
      color: #8c9ba5;
      font-size: 14px;
    }

    textarea.form-control {
      height: 105px;
      resize: vertical;
    }

    /* Send Button */
    .btn-send {
      width: 100%;
      background-color: #48cfad;
      color: #ffffff;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-send:hover {
      background-color: #37bc9b;
    }

    .btn-send:active {
      transform: scale(0.99);
      background-color: #2fb08f;
    }
  </style>
</head>
<body>

  <div class="exercise-title">Bài 2:</div>

  <div class="contact-card">
    <div class="card-header">
      <h2>Contact Us</h2>
    </div>

    <form class="card-body" action="#" method="POST" onsubmit="event.preventDefault(); alert('Gửi tin nhắn Bài 2 thành công!');">
      <div class="form-group">
        <input type="text" class="form-control" name="name" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <input type="email" class="form-control" name="email" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <textarea class="form-control" name="message" placeholder="Type your Message" required></textarea>
      </div>

      <button type="submit" class="btn-send">Send</button>
    </form>
  </div>

</body>
</html>
