<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 1 - Form Liên Hệ (CSS Box Model & Form Styling)</title>
  <style>
    /* Reset & Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f7f9fa;
      color: #333;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .exercise-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      align-self: flex-start;
      max-width: 500px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    /* Container Box matching the PDF */
    .form-container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border: 1px solid #7ea7c2;
      padding: 22px 24px;
      border-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
    }

    .required {
      color: #e53935;
      font-weight: bold;
      margin-left: 2px;
    }

    /* Input & Select Styling */
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #b5c3cb;
      border-radius: 2px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus,
    textarea:focus {
      border-color: #4ea3b4;
      box-shadow: 0 0 4px rgba(78, 163, 180, 0.4);
    }

    input::placeholder,
    textarea::placeholder {
      color: #8c9ba5;
      font-size: 13px;
    }

    /* Name Row: First & Last Name side by side */
    .name-row {
      display: flex;
      gap: 12px;
    }

    .name-row input {
      flex: 1;
    }

    /* Select Dropdown */
    select {
      cursor: pointer;
      appearance: auto;
      -webkit-appearance: menulist;
      -moz-appearance: menulist;
    }

    /* Textarea */
    textarea {
      height: 110px;
      resize: vertical;
    }

    /* Submit Button */
    .btn-submit {
      background-color: #4ea3b4;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      padding: 8px 22px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: #3d8e9f;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: #347c8b;
    }
  </style>
</head>
<body>

  <div class="exercise-title">Bài 1:</div>

  <form class="form-container" action="#" method="POST" onsubmit="event.preventDefault(); alert('Gửi form Bài 1 thành công!');">
    
    <!-- Full Name Field -->
    <div class="form-group">
      <label for="firstName">Full Name <span class="required">*</span></label>
      <div class="name-row">
        <input type="text" id="firstName" name="firstName" placeholder="First" required>
        <input type="text" id="lastName" name="lastName" placeholder="Last" required>
      </div>
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" name="email" required>
    </div>

    <!-- Subject Field -->
    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="advertise" selected>Advertise</option>
        <option value="partnership">Partnership</option>
        <option value="inquiry">General Inquiry</option>
        <option value="support">Technical Support</option>
      </select>
    </div>

    <!-- Your Message Field -->
    <div class="form-group">
      <label for="message">Your Message <span class="required">*</span></label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-submit">Submit</button>

  </form>

</body>
</html>
